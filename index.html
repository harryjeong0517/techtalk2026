<style>
/* 레이아웃: 관리자는 밝은 작업 화면, 메인 화면·투표 화면은 행사별 테마(--bg/--accent)를 입는다 */
:root{
  --ink:#0E1B2A; --ink-2:#506072; --line:#D9E1E8; --paper:#F3F6F9; --card:#FFFFFF;
  --brand:#009BDF; --brand-ink:#00709F; --ok:#0F7B57; --warn:#A8560B; --bad:#BE3A2F;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
img{max-width:100%}
#app{min-height:100%}

/* ---------- 데모 안내 띠 ---------- */
.demo{position:fixed;left:0;right:0;top:0;height:40px;z-index:50;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:#1B2A3A;color:#fff;font-size:13px;overflow-x:auto;white-space:nowrap}
.demo b{color:#FFD166;font-weight:700}
.demo .sp{flex:1;min-width:8px}
.demo button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.demo button.on{background:#fff;color:#1B2A3A;border-color:#fff}
body.is-demo{--demo-h:40px}
body.is-demo #app{padding-top:40px}

/* ---------- 공통 버튼(관리자) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;min-height:38px}
.btn:hover{border-color:#B9C5D0}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;background:#E6ECF1;color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.open{background:#DDF3EA;color:var(--ok)}
.pill.closed{background:#F8E1DE;color:var(--bad)}

/* ---------- 관리자 ---------- */
.adm{max-width:1180px;margin:0 auto;padding:20px 16px 96px}
.adm-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.adm-top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.adm-top .sp{flex:1}
.adm-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:800}
.card + .card{margin-top:14px}
.ev-list{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.ev-list button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ev-list button:hover{background:var(--paper)}
.ev-list button.on{background:#E8F5FC;border-color:#9DD5F0}
.ev-list .t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.ev-list .m{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field small{font-size:12px;color:var(--ink-2)}
.in{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-height:38px}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(0,155,223,.18)}
.in[readonly]{background:var(--paper);color:var(--ink-2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;align-items:start}
.live-nums{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin:10px 0 12px}
.live-nums b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.live-nums span{font-size:13px;color:var(--ink-2)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{display:grid;grid-template-columns:minmax(0,34%) 1fr 48px;gap:8px;align-items:center;font-size:13px}
.mini .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .b{height:8px;border-radius:9px;background:#E6ECF1;overflow:hidden}
.mini .b i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
.mini .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.qr-mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.qr-mini svg{display:block;width:100%;height:auto}
.link-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.link-row > span{font-weight:700;color:var(--ink-2)}
.cand{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.cand .ph{width:56px;height:56px;border-radius:8px;background:var(--paper) center/cover no-repeat;border:1px dashed #B9C5D0;display:grid;place-items:center;font-size:11px;color:var(--ink-2);cursor:pointer;text-align:center;line-height:1.2}
.cand .ph.has{border-style:solid;color:transparent}
.cand .ops{display:flex;gap:2px}
.swatch{display:flex;gap:8px;align-items:center}
.swatch input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.imgbox{display:flex;gap:12px;align-items:flex-start}
.imgbox > .stack{flex:1;min-width:0}
.imgbox .pv{flex:none;width:128px;height:72px;border-radius:8px;border:1px dashed #B9C5D0;background:var(--paper) center/cover no-repeat;display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.imgbox .pv.logo{background-size:contain;background-color:#93A1AE}
.imgbox .pv.has{border-style:solid;color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;z-index:20}
.savebar .msg{font-size:13px;color:var(--ink-2);margin-right:auto}
.savebar.dirty .msg{color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(14,27,42,.25)}
.toast.bad{background:var(--bad)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 16px}
.empty{color:var(--ink-2);font-size:14px;padding:28px 8px;text-align:center}
.hint{font-size:12.5px;color:var(--ink-2);margin:0}
@media (max-width:860px){
  .adm-grid{grid-template-columns:1fr}
  .live{grid-template-columns:1fr}
  .qr-mini{max-width:160px}
  .row2,.row3{grid-template-columns:1fr}
  .cand{grid-template-columns:56px minmax(0,1fr) auto}
  .cand .d{grid-column:2 / 4}
  .link-row{grid-template-columns:1fr auto auto}
  .link-row > span{grid-column:1 / -1}
}

/* ---------- 메인 화면(프로젝터) ---------- */
.scr{position:fixed;left:0;right:0;bottom:0;top:var(--demo-h,0px);overflow:hidden;background:var(--bg);color:var(--fg);
  --vh:calc((100vh - var(--demo-h,0px)) / 100);--u:min(1vw,calc(var(--vh) * 1.78));
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*2.2);padding:calc(var(--u)*3) calc(var(--u)*3.6);
  font-size:calc(var(--u)*1.6);color-scheme:dark}
.scr-bg{position:absolute;inset:0;background:var(--bg) center/cover no-repeat;z-index:0}
.scr-bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.6)}
.scr-bg.fit-fill{background-size:100% 100%}
.scr-bg.plain::after{opacity:1;background:
  radial-gradient(90% 70% at 88% -10%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 62%),
  radial-gradient(70% 60% at -5% 105%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),var(--bg)}
.scr > header,.scr > main{position:relative;z-index:1}
.scr-head{display:flex;align-items:center;gap:calc(var(--u)*2.2);min-width:0;min-height:0}
.scr-head img{height:calc(var(--u)*5.4);width:auto;max-width:calc(var(--u)*18);object-fit:contain;flex:none}
.scr-head .tt{min-width:0;flex:1}
.scr-head h1{margin:0;font-family:var(--tfont,inherit);font-synthesis:none;font-size:calc(var(--u)*3.5*var(--tscale,1));font-weight:800;letter-spacing:var(--tls,-.02em);line-height:1.15;text-wrap:balance}
.scr.stripes .scr-head h1{background-image:repeating-linear-gradient(to bottom,var(--fg) 0 .15em,transparent .15em .182em);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.scr-head p{margin:calc(var(--u)*.5) 0 0;font-size:calc(var(--u)*1.9);color:var(--fg-dim);font-weight:500}
.scr-pill{flex:none;display:inline-flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.5);font-weight:700;
  padding:calc(var(--u)*.7) calc(var(--u)*1.5);border-radius:99px;background:var(--track);white-space:nowrap}
.scr-pill i{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:var(--fg-dim)}
.scr.open .scr-pill{background:var(--accent);color:var(--on-accent)}
.scr.open .scr-pill i{background:var(--on-accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.scr-main{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*26);grid-template-rows:minmax(0,1fr);gap:calc(var(--u)*3.6);min-height:0}
.scr-list{position:relative;min-height:0;min-width:0}
.row{position:absolute;left:0;top:0;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;
  column-gap:1.6em;padding:0 1.9em 0 1.3em;border-radius:1.5em;background:var(--panel);
  transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.row.noth{grid-template-columns:auto minmax(0,1fr) auto}
.row .rk{font-family:var(--tfont,inherit);font-synthesis:none;font-size:2.7em;font-weight:800;width:1.5em;text-align:center;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.row .th{width:6.6em;height:6.6em;border-radius:1.1em;background:var(--track) center/cover no-repeat;display:grid;place-items:center}
.row .th span{font-size:2.6em;font-weight:800;color:var(--fg-dim)}
.row .bd{min-width:0;display:flex;flex-direction:column;gap:.55em}
.row .nm{font-size:3em;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.row .nm.long{font-size:2.35em}
.row .ds{font-size:1.6em;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-.2em}
.row .trk{height:1.5em;border-radius:1em;background:var(--track);overflow:hidden}
.row.nodesc .trk{height:2em}
.row .fill{height:100%;width:0;border-radius:inherit;background:var(--accent);opacity:.62;transition:width .7s cubic-bezier(.2,.8,.2,1),opacity .4s}
.row.lead .fill{opacity:1}
.scr.stripes .row .trk,.scr.stripes .row.nodesc .trk{height:2.3em;border-radius:.5em}
.scr.stripes .row .fill{opacity:1;border-radius:.3em;background:repeating-linear-gradient(to bottom,var(--accent) 0 .46em,transparent .46em .613em)}
.row.lead .rk{color:var(--fg)}
.row .ct{text-align:right;min-width:8.5em;white-space:nowrap}
.row .num{display:inline-block;font-family:var(--tfont,inherit);font-synthesis:none;font-size:4.4em;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row .un{font-size:1.7em;color:var(--fg-dim);margin-left:.2em;font-weight:600}
.row .pc{font-family:var(--lfont,inherit);font-size:1.7em;color:var(--fg-dim);font-variant-numeric:tabular-nums;margin-top:.15em}
.row .num.bump{animation:bump .5s}
@keyframes bump{35%{transform:scale(1.2)}}
.scr.closed .row.win{box-shadow:inset 0 0 0 .3em var(--accent)}
.scr.closed .row.win .rk{color:var(--accent)}
.scr-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);min-width:0;min-height:0;text-align:center}
.scr-side > *{flex:none;max-width:100%}
/* QR은 남는 높이만큼만 차지한다(최대 26u). 화면 비율이 달라져도 아래로 밀려 잘리지 않는다 */
.scr-side > .scr-qrw{flex:0 1 calc(var(--u)*26);min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.scr-side .note{font-size:calc(var(--u)*1.9);font-weight:700;line-height:1.3;text-wrap:balance}
.scr-qr{height:100%;max-width:100%;aspect-ratio:1/1;background:#fff;border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.5)}
.scr-qr svg{display:block;width:100%;height:100%}
.scr-side .url{font-family:var(--lfont,inherit);font-size:calc(var(--u)*1.15);color:var(--fg-dim);word-break:break-all;line-height:1.3}
.scr-side .vt{display:flex;align-items:baseline;justify-content:center;gap:calc(var(--u)*.8)}
.scr-side .vt span{font-size:calc(var(--u)*1.7);color:var(--fg-dim);font-weight:600}
.scr-side .vt b{font-family:var(--tfont,inherit);font-synthesis:none;font-size:calc(var(--u)*5);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.scr-side .end{font-size:calc(var(--u)*2.6);font-weight:800;line-height:1.3;padding:calc(var(--u)*3) 0}
.scr-ctl{position:absolute;right:calc(var(--u)*1.2);bottom:calc(var(--u)*1.2);z-index:3;display:flex;gap:8px;opacity:0;transition:opacity .3s}
.scr:hover .scr-ctl,.scr-ctl:focus-within{opacity:1}
.scr-ctl button,.scr-ctl span{border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:7px 12px}
.scr-ctl span.off{background:var(--bad)}
.scr-msg{position:fixed;inset:var(--demo-h,0px) 0 0 0;display:grid;place-items:center;text-align:center;padding:24px;font-size:18px;color:var(--ink-2)}
@media (max-aspect-ratio:1/1){
  .scr{--u:min(1.9vw,calc(var(--vh) * 1.05))}
  .scr-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .scr-side{flex-direction:row;align-items:center;justify-content:center;text-align:left;flex-wrap:wrap}
  .scr-side > .scr-qrw{flex:none;width:calc(var(--u)*17);height:calc(var(--u)*17)}
  .scr-bg.fit-fill{background-size:cover}
}

/* ---------- 투표 화면(휴대폰) ---------- */
.vote{min-height:calc(100vh - var(--demo-h,0px));min-height:calc(100dvh - var(--demo-h,0px));background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
.v-head{position:relative;padding:28px 20px 22px;background:var(--bg) center/cover no-repeat}
.v-head::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.6)}
.v-head.plain::before{opacity:1;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 62%),var(--bg)}
.v-head > *{position:relative}
.v-head img{height:32px;width:auto;max-width:150px;object-fit:contain;display:block;margin-bottom:14px}
.v-head h1{margin:0;font-family:var(--tfont,inherit);font-synthesis:none;font-size:calc(24px*var(--tscale,1));font-weight:800;letter-spacing:var(--tls,-.02em);line-height:1.25;text-wrap:balance}
.v-head p{margin:8px 0 0;font-size:15px;color:var(--fg-dim)}
.v-body{flex:1;width:100%;max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:10px}
.v-guide{font-size:13.5px;color:var(--fg-dim);margin:0 2px 2px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;
  border:2px solid transparent;background:var(--panel);color:var(--fg);border-radius:16px;padding:12px 16px;min-height:68px}
.opt.has-img{grid-template-columns:auto auto minmax(0,1fr) auto}
.opt .im{width:52px;height:52px;border-radius:12px;background:var(--track) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--fg-dim)}
.opt .no{font-size:15px;font-weight:800;color:var(--fg-dim);width:22px;text-align:center;font-variant-numeric:tabular-nums}
.opt .nm{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.opt .ds{font-size:13.5px;color:var(--fg-dim);margin-top:2px;overflow-wrap:anywhere}
.opt .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg-dim);display:grid;place-items:center}
.opt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel))}
.opt[aria-pressed=true] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed=true] .mk::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.v-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 28%);display:flex;justify-content:center}
.v-btn{width:100%;max-width:528px;border:0;border-radius:14px;min-height:56px;font-size:18px;font-weight:800;background:var(--accent);color:var(--on-accent)}
.v-btn[disabled]{opacity:.4}
.v-btn.sub{background:var(--track);color:var(--fg)}
.v-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:40px 24px 80px}
.v-state .ic{width:76px;height:76px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.v-state .ic::after{content:"";width:18px;height:34px;border:solid var(--on-accent);border-width:0 6px 6px 0;transform:rotate(45deg) translate(-3px,-3px)}
.v-state .ic.wait{background:var(--track)}
.v-state .ic.wait::after{width:26px;height:26px;border:4px solid var(--fg-dim);border-top-color:transparent;border-radius:50%;transform:none;animation:spin 1.1s linear infinite}
.v-state .ic.stop::after{width:26px;height:6px;border:0;background:var(--on-accent);transform:none;border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.v-state h2{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.v-state p{margin:0;font-size:15px;color:var(--fg-dim);max-width:30ch}
.v-state ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.v-state li{background:var(--panel);border-radius:12px;padding:10px 18px;font-weight:700;font-size:16px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet > div{width:100%;max-width:560px;background:var(--bg);color:var(--fg);border-radius:20px 20px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -1px 0 var(--track)}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sheet p{margin:0 0 16px;font-size:14px;color:var(--fg-dim)}
.sheet .names{font-weight:800;color:var(--fg);font-size:17px;margin-bottom:8px;overflow-wrap:anywhere}
.sheet .acts{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.v-err{background:var(--bad);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

(function(){
'use strict';

var SB_URL = String(CFG.SUPABASE_URL || '').trim().replace(/\/+$/, '');
var SB_KEY = String(CFG.SUPABASE_KEY || '').trim();
var DEMO = !(SB_URL && SB_KEY);
var REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
var $app = document.getElementById('app');

function makeStore(getArea){
  var mem = {}, broken = {};
  return {
    get: function(k){
      if (!broken[k]) { try { var v = getArea().getItem(k); if (v !== null) return v; } catch(e){} }
      return (k in mem) ? mem[k] : null;
    },
    set: function(k, v){
      mem[k] = v;
      try { getArea().setItem(k, v); broken[k] = false; } catch(e){ broken[k] = true; }
    },
    del: function(k){ delete mem[k]; try { getArea().removeItem(k); } catch(e){} }
  };
}
var store = makeStore(function(){ return window.localStorage; });
var sess  = makeStore(function(){ return window.sessionStorage; });

function h(tag, attrs){
  var el = document.createElement(tag), k, v;
  if (attrs) for (k in attrs) {
    v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') { for (var s in v) { if (s.indexOf('--') === 0) el.style.setProperty(s, v[s]); else el.style[s] = v[s]; } }
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(el, x); }); return; }
  el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
function clear(el){ while (el.firstChild) el.removeChild(el.firstChild); }
function fmt(n){ return Number(n || 0).toLocaleString('ko-KR'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return 'c' + Math.random().toString(36).slice(2, 8); }
function isHex(c){ return /^#[0-9a-f]{6}$/i.test(c || ''); }
function lum(hex){
  var n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function(v){

}

    l.href = 'https://fonts.googleapis.com/css2?family=' + f.css + '&display=swap';

function demoBurst(id){
  var left = 24;
  (function step(){
    var d = demoLoad(), p = d.polls[id];
    if (!p || p.status !== 'open' || left <= 0) return;
    var cs = p.config.candidates || []; if (!cs.length) return;
    var k = 1 + Math.floor(Math.random() * 3);
    d.votes[id] = d.votes[id] || {};
    while (k-- > 0 && left-- > 0) {
      var w = Math.pow(Math.random(), 1.6), c = cs[Math.floor(w * cs.length)];
      d.votes[id]['sim-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)] = [c.id];

    setTimeout(step, 420);
  })();
}

function scaleSrc(src, opt){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth || 800, hgt = img.naturalHeight || 600, k = Math.min(1, opt.max / Math.max(w, hgt));

        if (opt.square) { var m = Math.min(w, hgt); sx = (w - m) / 2; sy = (hgt - m) / 2; sw = sh = m; cw = ch = Math.min(opt.max, m); }
        var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        if (opt.auto || opt.type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
        if (opt.auto) {
          // 단색 위주의 그래픽은 PNG가 더 선명하고 작다. 사진은 JPEG가 작다. 둘 다 만들어 보고 고른다.
          var png = cv.toDataURL('image/png'), jpg = cv.toDataURL('image/jpeg', opt.q || .82);
          resolve(png.length <= opt.cap ? png : jpg);
        } else resolve(cv.toDataURL(opt.type, opt.q));
      } catch(e) { reject(new Error('이미지를 처리하지 못했습니다.')); }
    };
    img.onerror = function(){ reject(new Error('이미지를 읽지 못했습니다.')); };
    img.src = src;
  });
}
function scaleImage(file, opt){
  if (!file || !/^image\//.test(file.type)) return Promise.reject(new Error('이미지 파일만 올릴 수 있습니다.'));
  if (file.size > 20 * 1024 * 1024) return Promise.reject(new Error('20MB 이하 이미지를 사용해 주세요.'));
  var url = URL.createObjectURL(file);
  return scaleSrc(url, opt).then(function(r){ URL.revokeObjectURL(url); return r; }, function(e){ URL.revokeObjectURL(url); throw e; });

    var main = h('div', null);
    if (!poll || !draft) main.appendChild(h('div', { class: 'card empty' }, '왼쪽에서 투표를 고르거나 새로 만들어 주세요.'));
    else { main.appendChild(liveCard()); main.appendChild(infoCard()); main.appendChild(candCard()); main.appendChild(designCard()); main.appendChild(dangerCard()); }
    el.appendChild(h('div', { class: 'adm-grid' }, side, main));

    if (poll && draft) {
      saveBar = h('div', { class: 'savebar' }, h('span', { class: 'msg' }), h('button', { class: 'btn pri', type: 'button', onclick: save }, '변경사항 저장'));
      el.appendChild(saveBar); updateSaveBar();
    }
    updateLive();
  }
  function updateSaveBar(){
    if (!saveBar) return;
    saveBar.classList.toggle('dirty', dirty);
    saveBar.firstChild.textContent = dirty ? '저장하지 않은 변경이 있습니다' : '모든 변경이 저장되었습니다';
    saveBar.lastChild.disabled = !dirty;
  }

  function liveCard(){
    var st = poll.status, screenUrl = linkFor('screen', cur), voteUrl = linkFor('vote', cur);
    function copyBtn(input){
      return h('button', { class: 'btn sm', type: 'button', onclick: function(){
        var done = function(){ toast('주소를 복사했습니다.'); };
        try { navigator.clipboard.writeText(input.value).then(done, function(){ input.select(); toast('주소를 선택했습니다. Ctrl+C로 복사해 주세요.'); }); }
        catch(e) { input.select(); toast('주소를 선택했습니다. Ctrl+C로 복사해 주세요.'); }
      } }, '복사');
    }
    var sIn = h('input', { class: 'in', id: 'url-screen', readonly: true, value: screenUrl, 'aria-label': '메인 화면 주소' });
    var vIn = h('input', { class: 'in', id: 'url-vote', readonly: true, value: voteUrl, 'aria-label': '투표 주소' });
    liveRefs = { voters: h('b', null, '0'), votes: h('b', null, '0'), mini: h('div', { class: 'mini' }) };
    var btns = h('div', { class: 'inline' });
    if (st !== 'open') btns.appendChild(h('button', { class: 'btn go', type: 'button', onclick: function(){ setStatus('open'); } }, st === 'closed' ? '투표 다시 열기' : '투표 시작'));
    if (st === 'open') btns.appendChild(h('button', { class: 'btn stop', type: 'button', onclick: function(){ setStatus('closed'); } }, '투표 마감'));
    if (st !== 'ready') btns.appendChild(h('button', { class: 'btn', type: 'button', onclick: function(){ setStatus('ready'); } }, '대기 상태로'));
    var resetBtn = h('button', { class: 'btn', type: 'button', onclick: function(){
      twoStep('reset', resetBtn, '정말 초기화 (득표 전부 삭제)', function(){
        busy = true;
        api.adminReset(pw, cur).then(function(){ busy = false; live = null; toast('득표를 초기화했습니다. 참가자는 다시 투표할 수 있습니다.'); return refreshList(); }).then(render).catch(fail);
      });
    } }, '득표 초기화');
    btns.appendChild(resetBtn);

    return h('section', { class: 'card' },
      h('div', { class: 'inline', style: { justifyContent: 'space-between' } }, h('h2', { style: { margin: '0' } }, '진행'), h('span', { class: 'pill ' + st }, STATUS[st])),
      h('div', { class: 'live', style: { marginTop: '12px' } },
        h('div', null,
          btns,
          h('div', { class: 'live-nums' }, h('div', null, liveRefs.voters, h('span', null, ' 명 참여')), h('div', null, liveRefs.votes, h('span', null, ' 표'))),
          liveRefs.mini,
          h('div', { class: 'stack', style: { marginTop: '14px' } },
            h('div', { class: 'link-row' }, h('span', null, '메인 화면'), sIn, copyBtn(sIn),
              DEMO ? h('button', { class: 'btn sm pri', type: 'button', onclick: function(){ go('screen', cur); } }, '열기')
                   : h('a', { class: 'btn sm pri', href: screenUrl, target: '_blank', rel: 'noopener' }, '열기')),
            h('div', { class: 'link-row' }, h('span', null, '투표 주소'), vIn, copyBtn(vIn),
              DEMO ? h('button', { class: 'btn sm', type: 'button', onclick: function(){ go('vote', cur); } }, '열기')
                   : h('a', { class: 'btn sm', href: voteUrl, target: '_blank', rel: 'noopener' }, '열기')))),
        h('div', { class: 'qr-mini' }, qrSvg(voteUrl))));
  }
  function updateLive(){
    if (!liveRefs || !poll) return;
    var counts = (live && live.counts) || {}, total = 0, max = 0;
    poll.config.candidates.forEach(function(c){ var n = counts[c.id] || 0; total += n; if (n > max) max = n; });
    liveRefs.voters.textContent = fmt(live ? live.voters : 0);
    liveRefs.votes.textContent = fmt(total);
    clear(liveRefs.mini);
    poll.config.candidates.forEach(function(c){
      var n = counts[c.id] || 0;
      liveRefs.mini.appendChild(h('div', null, h('span', { class: 'n' }, c.name), h('span', { class: 'b' }, h('i', { style: { width: (max ? n / max * 100 : 0) + '%' } })), h('span', { class: 'c' }, fmt(n))));
    });
  }

  function text(id, label, key, opt){
    opt = opt || {};
    var input = h(opt.area ? 'textarea' : 'input', { class: 'in', id: id, maxlength: String(opt.max || 80), value: draft[key], rows: opt.area ? '2' : null,
      oninput: function(){ draft[key] = input.value; setDirty(); } });
    return h('label', { class: 'field', for: id }, h('span', null, label), input, opt.help ? h('small', null, opt.help) : null);
  }
  function infoCard(){
    var mc = h('select', { class: 'in', id: 'f-max', onchange: function(){ draft.maxChoices = parseInt(mc.value, 10) || 1; setDirty(); } },
      [1, 2, 3, 4, 5].map(function(n){ return h('option', { value: String(n) }, n === 1 ? '1개 (기본)' : n + '개까지'); }));
    mc.value = String(Math.min(5, draft.maxChoices));
    return h('section', { class: 'card stack' },
      h('h2', { style: { margin: '0' } }, '기본 정보'),
      h('div', { class: 'row2' },
        h('label', { class: 'field', for: 'f-id' }, h('span', null, 'ID'), h('input', { class: 'in', id: 'f-id', readonly: true, value: cur })),
        h('label', { class: 'field', for: 'f-max' }, h('span', null, '한 사람이 고를 수 있는 후보 수'), mc)),
      text('f-title', '제목', 'title', { max: 60 }),
      text('f-q', '안내 문구 (제목 아래)', 'question', { max: 100 }),
      text('f-qr', 'QR 위 안내 문구', 'qrNote', { max: 60 }));
  }
  function candCard(){
    var wrap = h('div', { class: 'stack', style: { gap: '8px' } });
    draft.candidates.forEach(function(c, i){
      var file = h('input', { type: 'file', accept: 'image/*', hidden: true, id: 'c-img-' + i, onchange: function(){
        var f = file.files[0]; if (!f) return;
        scaleImage(f, { max: 360, square: true, type: 'image/jpeg', q: .82 }).then(function(u){ c.img = u; setDirty(); render(); }).catch(function(e){ toast(e.message, true); });
      } });
      var ph = h('label', { class: 'ph' + (c.img ? ' has' : ''), for: 'c-img-' + i, title: '후보 이미지 선택' }, c.img ? '이미지' : '이미지 추가', file);
      if (c.img) ph.style.backgroundImage = cssUrl(c.img);
      var nm = h('input', { class: 'in', id: 'c-nm-' + i, value: c.name, maxlength: '40', placeholder: '후보 이름', 'aria-label': (i + 1) + '번 후보 이름', oninput: function(){ c.name = nm.value; setDirty(); } });
      var ds = h('input', { class: 'in d', id: 'c-ds-' + i, value: c.desc, maxlength: '60', placeholder: '설명 (선택)', 'aria-label': (i + 1) + '번 후보 설명', oninput: function(){ c.desc = ds.value; setDirty(); } });
      function move(d){ var j = i + d; if (j < 0 || j >= draft.candidates.length) return; draft.candidates.splice(j, 0, draft.candidates.splice(i, 1)[0]); setDirty(); render(); }
      wrap.appendChild(h('div', { class: 'cand' }, ph, nm, ds,
        h('div', { class: 'ops' },
          h('button', { class: 'btn sm ghost', type: 'button', 'aria-label': '위로', disabled: i === 0, onclick: function(){ move(-1); } }, '↑'),
          h('button', { class: 'btn sm ghost', type: 'button', 'aria-label': '아래로', disabled: i === draft.candidates.length - 1, onclick: function(){ move(1); } }, '↓'),
          c.img ? h('button', { class: 'btn sm ghost', type: 'button', onclick: function(){ c.img = ''; setDirty(); render(); } }, '이미지 빼기') : null,
          h('button', { class: 'btn sm ghost', type: 'button', onclick: function(){ draft.candidates.splice(i, 1); setDirty(); render(); } }, '삭제'))));
    });
    return h('section', { class: 'card stack' },
      h('div', { class: 'inline', style: { justifyContent: 'space-between' } },
        h('h2', { style: { margin: '0' } }, '후보 (' + draft.candidates.length + ')'),
        h('button', { class: 'btn sm', type: 'button', onclick: function(){
          draft.candidates.push({ id: uid(), name: '', desc: '', img: '' }); setDirty(); render();
          var last = document.getElementById('c-nm-' + (draft.candidates.length - 1)); if (last) last.focus();
        } }, '+ 후보 추가')),
      wrap,
      h('p', { class: 'hint' }, '투표 중에 후보를 삭제하면 그 후보가 받은 표는 화면에서 빠집니다. 메인 화면은 8개까지 한 줄, 9개부터 두 줄로 보입니다.'));
  }
  function imgField(label, key, o){
    function done(){ setDirty(); render(); }
    var file = h('input', { type: 'file', accept: 'image/*', hidden: true, id: 'img-' + key, onchange: function(){
      var f = file.files[0]; if (!f) return;
      o.pick(f).then(done).catch(function(e){ toast(e.message, true); });
    } });
    var pv = h('div', { class: 'pv' + (o.logo ? ' logo' : '') + (draft[key] ? ' has' : '') }, draft[key] ? '' : '없음');
    if (draft[key]) pv.style.backgroundImage = cssUrl(draft[key]);
    return h('div', { class: 'field' }, h('span', null, label),
      h('div', { class: 'imgbox' }, pv,
        h('div', { class: 'stack', style: { gap: '6px' } },
          h('div', { class: 'inline' },
            h('label', { class: 'btn sm', for: 'img-' + key }, draft[key] ? '바꾸기' : '이미지 선택', file),
            (draft[key] && !o.locked) ? h('button', { class: 'btn sm ghost', type: 'button', onclick: function(){ Promise.resolve(o.drop()).then(done); } }, '빼기') : null),
          h('small', null, o.help))));
  }
  function designCard(){
    function color(id, label, key){
      var c = h('input', { type: 'color', id: id, value: draft.theme[key], oninput: function(){ draft.theme[key] = c.value; t.value = c.value.toUpperCase(); setDirty(); } });
      var t = h('input', { class: 'in', value: draft.theme[key].toUpperCase(), maxlength: '7', 'aria-label': label + ' 색상 코드', style: { maxWidth: '110px' },
        oninput: function(){ if (isHex(t.value)) { draft.theme[key] = t.value; c.value = t.value; setDirty(); } } });
      return h('div', { class: 'field' }, h('label', { for: id }, h('span', { style: { fontSize: '12.5px', fontWeight: '700', color: 'var(--ink-2)' } }, label)), h('div', { class: 'swatch' }, c, t));
    }
    var dimOut = h('span', null, draft.theme.dim + '%');
    var dim = h('input', { type: 'range', id: 'f-dim', min: '0', max: '95', step: '1', value: String(draft.theme.dim), style: { width: '100%' },
      oninput: function(){ draft.theme.dim = parseInt(dim.value, 10); dimOut.textContent = dim.value + '%'; setDirty(); } });
    function chk(id, label, key){
      var c = h('input', { type: 'checkbox', id: id, onchange: function(){ draft[key] = c.checked; setDirty(); } });
      c.checked = !!draft[key];
      return h('label', { class: 'chk', for: id }, c, label);
    }
    function pick(id, label, opts, val, set){
      var sl = h('select', { class: 'in', id: id, onchange: function(){ set(sl.value); setDirty(); } },
        opts.map(function(o){ return h('option', { value: o[0] }, o[1]); }));
      sl.value = val;
      return h('label', { class: 'field', for: id }, h('span', null, label), sl);
    }
    return h('section', { class: 'card stack' },
      h('h2', { style: { margin: '0' } }, '디자인'),
      h('div', { class: 'row3' },
        imgField('키비주얼 · PC (메인 화면 배경)', 'keyVisual', {
          help: '16:9 가로 이미지 (1920×1080).',
          pick: function(f){
            var jobs = [scaleImage(f, KV_PC)]; if (!draft.kvSmCustom) jobs.push(scaleImage(f, KV_SM));
            return Promise.all(jobs).then(function(r){ draft.keyVisual = r[0]; if (r[1]) draft.keyVisualSm = r[1]; });
          },
          drop: function(){ draft.keyVisual = ''; if (!draft.kvSmCustom) draft.keyVisualSm = ''; } }),
        imgField('키비주얼 · 모바일 (휴대폰 상단)', 'keyVisualSm', {
          help: draft.kvSmCustom ? '모바일 전용 이미지를 쓰는 중입니다.' : '넣지 않으면 PC용을 줄여 씁니다. 가로로 긴 이미지 (약 2.3:1).',
          locked: !draft.kvSmCustom,
          pick: function(f){ return scaleImage(f, KV_SM).then(function(u){ draft.keyVisualSm = u; draft.kvSmCustom = true; }); },
          drop: function(){
            draft.kvSmCustom = false; draft.keyVisualSm = '';
            if (draft.keyVisual) return scaleSrc(draft.keyVisual, KV_SM).then(function(u){ draft.keyVisualSm = u; }, function(){});
          } }),
        imgField('로고 (왼쪽 위)', 'logo', { logo: true, help: '배경이 투명한 PNG.',
          pick: function(f){ return scaleImage(f, { max: 600, type: 'image/png' }).then(function(u){ draft.logo = u; }); },
          drop: function(){ draft.logo = ''; } })),
      h('div', { class: 'row3' },
        color('f-accent', '포인트 컬러 (막대·버튼)', 'accent'),
        color('f-bg', '배경 컬러', 'bg'),
        h('div', { class: 'field' }, h('label', { for: 'f-dim' }, h('span', { style: { fontSize: '12.5px', fontWeight: '700', color: 'var(--ink-2)' } }, '키비주얼 덮는 정도 '), dimOut), dim,
          h('small', null, '높을수록 글자가 잘 보입니다.'))),
      h('div', { class: 'row3' },
        pick('f-font', '제목·숫자 글꼴', [['default', '기본 (Pretendard)']].concat(Object.keys(FONTS).map(function(k){ return [k, FONTS[k].name]; })),
          draft.titleFont, function(v){ draft.titleFont = v; }),
        pick('f-tone', '글자 색', [['auto', '자동 (배경 밝기에 맞춤)'], ['dark', '검정 글자'], ['light', '흰 글자']],
          draft.theme.tone, function(v){ draft.theme.tone = v; }),
        pick('f-fit', 'PC 키비주얼 맞춤', [['cover', '채우기 (비율 유지, 가장자리 잘림)'], ['fill', '화면에 꼭 맞추기 (가장자리 유지)']],
          draft.kvFit, function(v){ draft.kvFit = v; })),
      h('div', { class: 'inline', style: { gap: '20px' } }, chk('f-stripes', '줄무늬 스타일 (제목·막대)', 'stripes')),
      h('div', { class: 'inline', style: { gap: '20px' } },
        chk('f-sort', '득표순으로 실시간 순위 정렬', 'sortLive'),
        chk('f-pct', '득표율(%) 함께 표시', 'showPercent')));
  }
  function dangerCard(){
    var del = h('button', { class: 'btn', type: 'button', onclick: function(){
      twoStep('del', del, '정말 삭제 (되돌릴 수 없음)', function(){
        api.adminDelete(pw, cur).then(function(){ toast('투표를 삭제했습니다.'); cur = ''; poll = null; draft = null; dirty = false; return refreshList(); }).then(afterList).catch(fail);
      });
    } }, '이 투표 삭제');
    return h('section', { class: 'card inline', style: { justifyContent: 'space-between' } },
      h('p', { class: 'hint' }, '행사가 끝난 투표는 삭제해 두면 목록이 깔끔합니다.'), del);
  }

  /* ---- 시작 ---- */
  if (!authed && pw) {
    api.adminList(pw).then(function(l){ authed = true; list = l || []; afterList(); }).catch(function(){ pw = ''; sess.del('qv-pw'); render(); });
    el.appendChild(h('div', { class: 'empty' }, '불러오는 중…'));
  } else if (authed) {
    el.appendChild(h('div', { class: 'empty' }, '불러오는 중…'));
    refreshList().then(afterList).catch(fail);
  } else render();
}

window.addEventListener('popstate', route);
route();
})();
</script>
</body>
</html>
